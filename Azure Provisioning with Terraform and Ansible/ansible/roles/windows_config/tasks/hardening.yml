- name: Obtener nombre del dominio actual
  win_shell: |
    $env:USERDOMAIN
  register: userdomain_check

- name: Mostrar dominio actual detectado
  debug:
    var: userdomain_check.stdout

- name: Abortar si la VM no está en el dominio "lab"
  fail:
    msg: "❌ La máquina no pertenece al dominio lab.local. Abortando hardening por seguridad."
  when: userdomain_check.stdout != "lab"

# Aquí va tu lógica real de hardening
- name: Deshabilitar SMBv1
  win_feature:
    name: FS-SMB1
    state: absent

- name: Forzar contraseñas fuertes
  win_security_policy:
    name: PasswordComplexity
    state: enabled

# Agregá todas las medidas adicionales que tengas acá...

# Solo si está en dominio, se elimina el usuario local
- name: Eliminar cuenta local "Administrator"
  win_user:
    name: Administrator
    state: absent
  when: userdomain_check.stdout == "lab"
